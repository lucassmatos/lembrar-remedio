; Firmware do device físico da timeline — LilyGo T5 4.7" V2.4 (ESP32-S3)
;
; A config é espelhada do repo oficial LilyGo-EPD47 — é a única combinação
; garantida pra ESSA placa (board json customizado + flags certos).

[platformio]
boards_dir = boards          ; usa a definição T5-ePaper-S3.json daqui da pasta
default_envs = T5-ePaper-S3

[env:T5-ePaper-S3]
platform = espressif32@6.12.0
board = T5-ePaper-S3
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; deixa o pio achar a porta sozinho; se precisar fixar, descomente:
; upload_port = /dev/cu.usbmodem101

; build flags (o "porquê" de cada um):
;  BOARD_HAS_PSRAM        -> habilita a memória extra (pro framebuffer)
;  ARDUINO_USB_CDC_ON_BOOT-> Serial pelo USB nativo do S3 (pra ver logs)
;  LILYGO_T5_EPD47_S3     -> diz à lib quais PINOS usar (variante S3)
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=0

; a lib da tela traz: epd_driver.h + a fonte FiraSans + suas deps.
; Button2/SensorLib/ArduinoJson nas versões que o projeto oficial usa.
lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git
	lewisxhe/SensorLib @ 0.3.1
	lennarthennigs/Button2 @ 2.3.2
	bblanchon/ArduinoJson @ ^7.4.2
